version: 2.1

jobs:
  build:
    docker:
      - image: cimg/base:stable

    steps:
      - checkout

      - run:
          name: Verify web app
          command: |
            test -s index.html
            grep -q "my-web-app2" index.html

      - setup_remote_docker

      - run:
          name: Build Docker image
          command: docker build --tag my-web-app2:${CIRCLE_SHA1} .

workflows:
  build-and-test:
    jobs:
      - build
